<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Admin BKP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body class="bg-light">
<div class="container py-5" style="max-width:600px">
<h2 class="text-center">🔐 Admin - PACIFIQUE_BKP TECHNOLOGY</h2>
<div id="login" class="card p-4 mt-4"><input id="pass" type="password" class="form-control" placeholder="Mot de passe admin"><button onclick="login()" class="btn btn-dark w-100 mt-3">Entrer</button><p class="small mt-2">Mot de passe par défaut: bkp2026 (change-le après)</p></div>
<div id="panel" class="d-none"><div class="card p-4 mt-4"><h5>Commandes reçues (Firebase)</h5><div id="list">Chargement...</div></div></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyC__3NS0ZA9h8kd_Qyoovs-PiivzFqfhCI", authDomain: "bkp-technology.firebaseapp.com", projectId: "bkp-technology", storageBucket: "bkp-technology.appspot.com", messagingSenderId: "463493266655", appId: "1:463493266655:web:5b6c78f89ce0e96c3a7d6a" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
window.login=()=>{if(document.getElementById('pass').value==="bkp2026"){document.getElementById('login').classList.add('d-none');document.getElementById('panel').classList.remove('d-none');load();}else alert("Mauvais mot de passe");}
async function load(){const snap=await getDocs(collection(db,"commandes"));let h="";snap.forEach(d=>{h+=`<div class='border-bottom py-2'><b>${d.data().nom}</b> - ${d.data().telephone} - ${d.data().date?.toDate()}</div>`});document.getElementById('list').innerHTML=h||"Aucune commande";}
</script></body></html>
